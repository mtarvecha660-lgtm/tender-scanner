# ============================================================
#  TENDER SCANNER SETTINGS  —  edit this file on GitHub
#  (click the pencil icon, change words, then "Commit changes")
#  Lines starting with # are notes and are ignored.
# ============================================================

# Which states to keep. Only tenders located in these states are saved.
states: [Madhya Pradesh, Rajasthan]

# Your home area. Tenders from these districts get a "Near you" badge
# and appear first in the grocery list.
home_districts: [Mandsaur, Neemuch, Ratlam, Ujjain, Chittorgarh, Pratapgarh, Jhalawar]

# Tenders closing within this many days get a red "Closing soon" badge.
closing_soon_days: 3

# Closed tenders stay on the dashboard history this many days, then are removed.
keep_closed_days: 30

# ------------------------------------------------------------
#  CATEGORIES
#  A tender gets EVERY category whose words appear in its title/items.
#  A tender with Grocery + something else is still shown under Grocery
#  (with a small "mixed" tag). Words are matched as whole words,
#  upper/lower case does not matter. Add Hindi spellings if you like.
#  Order matters only for display.
# ------------------------------------------------------------
