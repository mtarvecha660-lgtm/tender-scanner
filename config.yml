# GeM only: extra keyword searches so grocery items hidden inside long
# multi-item bids are not missed. GeM searches every item line for these.
gem_grocery_searches: [atta, wheat flour, rice, dal, pulses, sugar, edible oil, mustard oil, ghee, tea, spices, salt, besan, poha, ration, grocery, provisions, soap, detergent, milk powder, biscuits, jaggery]
